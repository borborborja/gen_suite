[project]
name = "fs-core"
version = "0.1.0"
description = "Vendored FamilySearch core (fs_downloader). Runtime deps provided by the backend image."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fs_core*"]
