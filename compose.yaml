name: gen_suite

# Generic, portable stack — works on any host (amd64/arm64) with Docker.
#   Configure config/.env, then: docker compose --env-file config/.env up -d --build --wait
#   Initial administration and optional setup helper: see DEPLOY.md.
#
# Config lives in ./config (config/.env) and all persistent data under ./data (DATA_DIR) — both
# host-mapped so you can see/back-up/move them. Object storage defaults to a bundled MinIO (profile
# "bundled-storage"); to use an EXTERNAL S3 (AWS/Backblaze/Wasabi) set MINIO_* + COMPOSE_PROFILES= in
# config/.env and the bundled MinIO won't start. The frontend (nginx + /api proxy) is on :8080.
# Homelab overlay (Cloudflare tunnel, external nets): docker compose -f compose.micapum.yaml up -d --build
# Build on the target arch (or: docker buildx build --platform linux/amd64) — see DEPLOY.md.

# Each consumer can build the shared image on a clean host; no installer/pre-build is required.
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: gen-suite-backend:latest

services:
  gen-suite-db:
    image: pgvector/pgvector:pg16
    container_name: gen-suite-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gen-suite-redis:
    image: redis:7-alpine
    container_name: gen-suite-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Bundled object storage. Only runs with COMPOSE_PROFILES=bundled-storage (the default in
  # config/.env.example). For external S3, clear COMPOSE_PROFILES and set the MINIO_* vars.
  gen-suite-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: gen-suite-minio
    profiles: ["bundled-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - 127.0.0.1:9001:9001   # console — localhost only; do not publish
    restart: unless-stopped

  gen-suite-migrate:
    <<: *backend-image
    container_name: gen-suite-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: [config/.env]
    environment:
      POSTGRES_HOST: gen-suite-db
    depends_on:
      gen-suite-db:
        condition: service_healthy
    restart: "no"

  gen-suite-backend:
    <<: *backend-image
    container_name: gen-suite-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [config/.env]
    environment:
      POSTGRES_HOST: gen-suite-db
      REDIS_URL: redis://:${REDIS_PASSWORD}@gen-suite-redis:6379/0
      # MINIO_ENDPOINT comes from config/.env (gen-suite-minio:9000 for bundled, or your S3 host).
    volumes:
      - ${CONFIG_DIR:-./config}:/config:ro   # operator files (TLS certs, optional kraken models…)
    depends_on:
      gen-suite-db:
        condition: service_healthy
      gen-suite-redis:
        condition: service_healthy
      gen-suite-minio:
        condition: service_healthy
        required: false  # absent when using external S3
      gen-suite-migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8000:8000   # API + Swagger at /docs — localhost (the frontend proxies /api internally)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  gen-suite-worker:
    <<: *backend-image
    container_name: gen-suite-worker
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file: [config/.env]
    environment:
      POSTGRES_HOST: gen-suite-db
      REDIS_URL: redis://:${REDIS_PASSWORD}@gen-suite-redis:6379/0
    volumes:
      - ${CONFIG_DIR:-./config}:/config:ro
    depends_on:
      gen-suite-redis:
        condition: service_healthy
      gen-suite-minio:
        condition: service_healthy
        required: false
      gen-suite-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional local PDF/A conversion. No public port, Docker socket or data mount.
  gen-suite-pdfa:
    profiles: ["pdfa"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: pdfa
    image: gen-suite-pdfa:latest
    command: ["arq", "app.tasks.worker.PdfaWorkerSettings"]
    env_file: [config/.env]
    environment:
      POSTGRES_HOST: gen-suite-db
      REDIS_URL: redis://:${REDIS_PASSWORD}@gen-suite-redis:6379/0
    read_only: true
    user: "10001:10001"
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=4g,mode=1777,nosuid,nodev"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      gen-suite-redis: { condition: service_healthy }
      gen-suite-minio: { condition: service_healthy, required: false }
      gen-suite-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "arq", "--check", "app.tasks.worker.PdfaWorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  gen-suite-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: gen-suite-frontend:latest
    container_name: gen-suite-frontend
    depends_on:
      gen-suite-backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8080}:80  # expose only through the host TLS proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
