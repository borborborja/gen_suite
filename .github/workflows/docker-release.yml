# Solo tras acreditar CI y recuperación del commit exacto en main, una release
# (tag vX.Y.Z) construye y sube las imágenes multi-arch
# (amd64/arm64, ver DEPLOY.md) a GHCR: ghcr.io/borborborja/gen-suite-{backend,pdfa,frontend}.
name: docker-release

on:
  release:
    types: [published]
  workflow_dispatch:  # relanzar un build sin publicar una release nueva
    inputs:
      tag:
        description: "Tag de imagen a publicar (p.ej. 0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: gate
        name: Exigir CI y recuperación completos del mismo commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_release.py

  build-push:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: gen-suite-backend
            dockerfile: docker/backend.Dockerfile
            target: runtime
          - image: gen-suite-pdfa
            dockerfile: docker/backend.Dockerfile
            target: pdfa
          - image: gen-suite-frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
