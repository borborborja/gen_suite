[project]
name = "gen-suite-backend"
version = "0.1.0"
description = "gen_suite — multi-tenant genealogy research suite (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "arq>=0.26",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "pypdf>=4.2",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "pikepdf>=8.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "pgvector>=0.3",
    "jellyfish>=1.0",
    "requests>=2.31",
    "piexif>=1.1.3",
    "urllib3<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
